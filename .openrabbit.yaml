# yaml-language-server: $schema=https://openrabbit.dev/schema/v1.json
# ============================================================================
# OpenRabbit Configuration (.openrabbit.yaml)
# Open-Source AI Pull Request Reviewer & Interactive PR Companion
# ============================================================================

language: en-US
profile: chill
tone_instructions: Be constructive, concise, and high-signal. Prioritize real bugs, security vulnerabilities, race conditions, and performance bottlenecks over stylistic nitpicks.
early_access: true
reviews:
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - master
      - develop
  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!*.lock"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!**/*.min.js"
    - "!**/*.snap"
  path_instructions:
    - path: "src/api/**"
      instructions: "Verify authentication checks, input validation, rate limiting, and SQL/command injection safety on all endpoints."
    - path: "**/*.tsx"
      instructions: "Check for React hook dependency array bugs, stale closures, memory leaks in useEffect, and accessibility attributes."
    - path: "**/*.py"
      instructions: "Enforce PEP 8 conventions, verify mutable default arguments, prevent SQL injection in f-strings, check subprocess shell=False, and ensure exception handling specificity."
    - path: "**/*.go"
      instructions: "Ensure all returned errors are handled, verify defer resp.Body.Close() on HTTP responses, prevent fmt.Sprintf SQL injection, and guard against goroutine leaks."
    - path: "**/*.rs"
      instructions: "Prevent unwrap() in production error paths (prefer ? or unwrap_or_default), document unsafe blocks with // SAFETY: comments, and audit clone() efficiency."
    - path: "tests/**"
      instructions: "Ensure tests cover edge cases, error paths, and avoid brittle timing assumptions."
chat:
  auto_reply: true
llm:
  provider: auto
  temperature: 0.2
